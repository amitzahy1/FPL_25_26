<title>מפת הסקאוטינג — מוקאפ C</title>
<style>
/* ============================================================
   MOCKUP C — "מפת הסקאוטינג" / SCOUT MAP
   Identity: cartographic lab. Graphite ink on a faintly
   blue-green paper, oxidized-teal accent, hairline rules,
   canvas instruments, coordinate-style readouts.
   New idea: "אזור מטרה" — you draw a region on the map and the
   app watches that thesis, not just individual players.
   Committed light theme (per brief).
   ============================================================ */
:root{
  color-scheme: light;
  --paper:#F3F6F6;
  --panel:#FFFFFF;
  --panel-2:#FAFCFC;
  --ink:#141D1C;
  --ink-2:#4C5A59;
  --ink-3:#84918F;
  --rule:#E0E7E6;
  --rule-2:#C6D2D1;
  --accent:#0B6A72;
  --accent-2:#0E8992;
  --accent-soft:#E6F1F2;
  --gold:#B07E05;
  --good:#0E7A4A; --bad:#B4322A; --warn:#9C5D08;
  --gk:#7A3CB8; --def:#1C6EB6; --mid:#0D8A5E; --fwd:#C0511A;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Arial Hebrew",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
.app{direction:rtl; font-family:var(--ui); background:var(--paper); color:var(--ink);
  min-height:100vh; padding:16px 18px 96px; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.n{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ni{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.lab{font-size:10.5px; font-weight:700; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px}

/* ---------- header ---------- */
.hd{display:flex; align-items:center; gap:13px; flex-wrap:wrap; padding-bottom:11px; margin-bottom:11px;
  border-bottom:1px solid var(--rule-2)}
.hd h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.4px}
.hd h1 span{color:var(--accent)}
.flag{font-size:10.5px; color:var(--ink-3); border:1px solid var(--rule-2); border-radius:3px;
  padding:3px 7px; background:var(--panel)}
.flag i{font-style:normal; font-family:var(--mono); letter-spacing:.12em; text-transform:uppercase}
.hd .sp{flex:1}
.coord{font-family:var(--mono); font-size:11px; color:var(--ink-3); background:var(--panel);
  border:1px solid var(--rule); border-radius:4px; padding:4px 9px}

/* ---------- ticker ---------- */
.tick{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--rule);
  border-radius:5px; padding:8px 11px; margin-bottom:12px; overflow-x:auto}
.tick .t{flex:none}
.tick-items{display:flex; gap:7px}
.mv{flex:none; display:flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--rule);
  border-radius:4px; padding:3px 8px; background:var(--panel-2); white-space:nowrap; cursor:pointer}
.mv:hover{border-color:var(--rule-2)}
.mv b{font-family:var(--mono); font-size:11.5px; direction:ltr; unicode-bidi:isolate}
.mv.up b{color:var(--good)} .mv.dn b{color:var(--bad)}
.mv .d{width:5px;height:5px;border-radius:50%}

/* ---------- toolbar ---------- */
.tools{display:flex; gap:9px; align-items:center; flex-wrap:wrap; background:var(--panel);
  border:1px solid var(--rule); border-radius:5px; padding:9px 11px; margin-bottom:12px}
.fld{display:flex; align-items:center; gap:6px}
.fld label{font-size:11.5px; color:var(--ink-3); font-weight:700}
select,.mini{border:1px solid var(--rule-2); background:var(--panel-2); border-radius:4px; padding:5px 8px;
  font-family:inherit; font-size:12.5px; color:var(--ink); font-weight:600}
.tog{display:flex; border:1px solid var(--rule-2); border-radius:4px; overflow:hidden}
.tog button{border:none; background:var(--panel-2); padding:5px 10px; font-size:12px; font-weight:700; color:var(--ink-2);
  border-inline-start:1px solid var(--rule)}
.tog button:first-child{border:none}
.tog button[aria-pressed="true"]{background:var(--accent); color:#fff}
.tog.g button[aria-pressed="true"]{background:var(--gold)}
.vr{width:1px;align-self:stretch;background:var(--rule)}
.tools .sp{flex:1}
.zonebtn{border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:4px;
  padding:5px 11px; font-size:12.5px; font-weight:800}
.zonebtn[aria-pressed="true"]{background:var(--accent); color:#fff; border-style:solid}

/* ---------- split ---------- */
.split{display:grid; grid-template-columns:1.55fr 1fr; gap:12px; align-items:start}
.pane{background:var(--panel); border:1px solid var(--rule); border-radius:5px; overflow:hidden}
.pane-hd{display:flex; align-items:center; gap:9px; padding:9px 12px; border-bottom:1px solid var(--rule); background:var(--panel-2)}
.pane-hd h2{margin:0; font-size:13px; font-weight:800; letter-spacing:-.2px}
.pane-hd .sp{flex:1}

/* map */
.mapbox{position:relative; padding:10px}
#map{display:block; width:100%; height:auto; cursor:crosshair; touch-action:none}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:#fff; border-radius:5px; padding:7px 9px;
  font-size:12px; opacity:0; transition:opacity .1s; z-index:5; white-space:nowrap; max-width:240px}
.tip.on{opacity:1}
.tip b{display:block; font-size:13px; margin-bottom:2px}
.tip i{font-style:normal; color:#9FB2B1; font-family:var(--mono); font-size:11px}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:9px 12px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-2); background:var(--panel-2)}
.legend span{display:flex; align-items:center; gap:5px}
.legend .sw{width:10px;height:10px;border-radius:50%}
.legend .hollow{background:transparent; border:1.6px solid var(--ink-3)}
.legend .ring{box-shadow:0 0 0 2px var(--gold)}

/* zone readout */
.zone{border-top:1px solid var(--rule); background:#FBFEFE; padding:11px 12px; display:none}
.zone.on{display:block}
.zone-hd{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.zone-hd h3{margin:0; font-size:13.5px; font-weight:800}
.zone-hd .sp{flex:1}
.zone-hd .n{font-size:11px; color:var(--ink-3)}
.zone p{margin:0 0 9px; font-size:12.5px; color:var(--ink-2); max-width:76ch}
.zone-acts{display:flex; gap:7px; flex-wrap:wrap}
.btn{border:1px solid var(--rule-2); background:var(--panel); border-radius:4px; padding:6px 11px;
  font-size:12.5px; font-weight:700; color:var(--ink-2)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.gold{background:#FDF6E3; border-color:#E7CE8C; color:var(--gold)}

/* list */
.plist{max-height:60vh; overflow-y:auto}
.pr{display:grid; grid-template-columns:22px auto 1fr auto auto; gap:9px; align-items:center;
  padding:8px 11px; border-bottom:1px solid var(--rule); cursor:pointer}
.pr:hover{background:#FAFDFD}
.pr.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.pr .rk{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); text-align:end}
.pr .st{border:none; background:transparent; font-size:14px; color:var(--rule-2); padding:0}
.pr .st.on{color:var(--gold)}
.pr h4{margin:0; font-size:13.5px; font-weight:750; display:flex; align-items:center; gap:6px}
.pr .m{font-size:10.5px; color:var(--ink-3); display:flex; gap:5px; align-items:center; margin-top:1px}
.pos{font-family:var(--mono); font-size:9px; font-weight:800; padding:1.5px 4px; border-radius:3px; letter-spacing:.04em; color:#fff}
.p-GK{background:var(--gk)} .p-DEF{background:var(--def)} .p-MID{background:var(--mid)} .p-FWD{background:var(--fwd)}
.free{color:var(--good); font-weight:700}
.pr .sc{font-family:var(--mono); font-size:14px; font-weight:700; text-align:end;
  direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums}
.pr .xd{font-family:var(--mono); font-size:11px; text-align:end; width:36px;
  direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums}
.pr .xd.neg{color:var(--good)} .pr .xd.pos{color:var(--bad)}
.mini-fx{display:flex; gap:1.5px}
.mini-fx i{width:11px;height:11px;border-radius:2px;font-style:normal}
.f1{background:#BFE5CF} .f2{background:#DCEFE3} .f3{background:#E9ECEB} .f4{background:#F7DCD6} .f5{background:#EFC0B7}

/* drawer */
.drawer{background:var(--panel); border:1px solid var(--rule); border-radius:5px; margin-top:12px; display:none}
.drawer.on{display:block}
.dr-hd{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.dr-hd h2{margin:0; font-size:19px; font-weight:800; letter-spacing:-.5px}
.dr-hd .sp{flex:1}
.dr-grid{display:grid; grid-template-columns:1fr 232px 250px; gap:0}
.dr-grid > section{padding:14px 16px; border-inline-start:1px solid var(--rule)}
.dr-grid > section:first-child{border:none}
.dr-grid h4{margin:0 0 9px}
.dr-grid p{margin:0 0 11px; font-size:13px; color:var(--ink-2); line-height:1.6; max-width:60ch}
.rz{display:flex; flex-wrap:wrap; gap:5px}
.rz span{font-size:11px; border:1px solid var(--rule); background:var(--panel-2); border-radius:3px; padding:2px 6px; color:var(--ink-2)}
.kv{display:grid; gap:0; margin-top:12px}
.kv div{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dotted var(--rule); font-size:12.5px}
.kv div:last-child{border:none}
.kv b{font-family:var(--mono); font-size:12.5px}
.fxwide{display:flex; gap:3px; margin-top:9px}
.fxwide i{flex:1; height:24px; border-radius:3px; font-family:var(--mono); font-size:8.5px; font-style:normal;
  font-weight:700; display:grid; place-items:center; color:var(--ink-2)}
.fxwide i.away{box-shadow:inset 0 -3px 0 rgba(0,0,0,.13)}

/* watch rail */
.rail{position:fixed; inset-block-end:0; inset-inline:0; background:var(--panel); border-top:1px solid var(--rule-2);
  padding:9px 18px; display:flex; align-items:center; gap:11px; z-index:20; box-shadow:0 -3px 14px rgba(20,29,28,.06)}
.rail .t{display:flex; align-items:center; gap:7px; flex:none}
.rail .cnt{font-family:var(--mono); background:var(--gold); color:#fff; border-radius:3px; padding:1px 6px; font-size:11.5px}
.rail-items{display:flex; gap:7px; overflow-x:auto; flex:1; padding:2px 0}
.wc{flex:none; display:flex; align-items:center; gap:7px; border:1px solid #E7CE8C; background:#FDF9EE;
  border-radius:100px; padding:4px 10px; font-size:12.5px; cursor:pointer}
.wc:hover{background:#FCF4E0}
.wc b{font-family:var(--mono); font-size:11.5px; color:var(--gold)}
.wc .x{border:none;background:transparent;color:var(--ink-3);font-size:14px;padding:0;line-height:1}
.rail .empty{font-size:12.5px; color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1080px){ .split{grid-template-columns:1fr} .dr-grid{grid-template-columns:1fr}
  .dr-grid>section{border-inline-start:none;border-top:1px solid var(--rule)} }
</style>

<div class="app" lang="he">

</div>

  /* axis titles */
  cx.font='700 11.5px -apple-system,system-ui,sans-serif'; cx.fillStyle='#4C5A59';
  cx.textAlign='center'; cx.fillText(AXES[S.x].l,PAD.l+(w-PAD.l-PAD.r)/2,h-6);
  cx.save();cx.translate(14,PAD.t+(h-PAD.t-PAD.b)/2);cx.rotate(-Math.PI/2);
  cx.fillText(AXES[S.y].l,0,0);cx.restore();
  /* zone */
  if(S.zone){const z=S.zone;
    cx.fillStyle='rgba(11,106,114,.07)'; cx.strokeStyle='#0B6A72'; cx.setLineDash([5,3]); cx.lineWidth=1.4;
    cx.fillRect(z.x,z.y,z.w,z.h); cx.strokeRect(z.x,z.y,z.w,z.h); cx.setLineDash([]);
    cx.fillStyle='#0B6A72'; cx.font='700 10px ui-monospace,Menlo,monospace';
    cx.textAlign='left'; cx.fillText('אזור מטרה',z.x+5,z.y+13)}
  /* bubbles */
  plot=[];
  const R=p=>S.size==='flat'?9:S.size==='mins'?5+(p.mins/1200)*10:5+ease(p)*11;
  data.forEach(p=>{
    const px=X(+p[S.x]),py=Y(+p[S.y]),r=R(p),free=!p.owner,col=POSC[p.pos];
    plot.push({p,px,py,r});
    if(S.watch.has(p.id)){cx.beginPath();cx.arc(px,py,r+4,0,7);cx.strokeStyle='#B07E05';cx.lineWidth=1.8;cx.stroke()}
    cx.beginPath(); cx.arc(px,py,r,0,7);
    if(free){cx.fillStyle=col+'D9';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1.4;cx.stroke()}
    else{cx.fillStyle=col+'22';cx.fill();cx.strokeStyle=col;cx.lineWidth=1.6;cx.stroke()}
    if(S.sel===p.id){cx.beginPath();cx.arc(px,py,r+8,0,7);cx.strokeStyle='#141D1C';cx.lineWidth=1.2;cx.stroke()}
    /* name every available player — the map exists to find those; owned ones only when big or active */
    if(free||r>=15||S.sel===p.id||S.hover===p.id){
      cx.font='600 10.5px -apple-system,system-ui,sans-serif'; cx.textAlign='center';
      /* flip below the bubble when the label would leave the plot */
      const ly=py-r-6<PAD.t+12?py+r+13:py-r-6;
      /* halo keeps names legible where bubbles or quadrant labels crowd */
      cx.lineWidth=3.2; cx.strokeStyle='rgba(255,255,255,.92)'; cx.strokeText(p.name,px,ly);
      cx.fillStyle='#141D1C'; cx.fillText(p.name,px,ly)}
  });
  document.getElementById('mapTitle').textContent=`${AXES[S.y].l} מול ${AXES[S.x].l}`;
  document.getElementById('mapCount').textContent=`${data.length} שחקנים · הצלב = חציון הליגה`;
}
/* hover + select + zone drag */
const tip=document.getElementById('tip');
function at(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('mousemove',e=>{
  const {x,y}=at(e);
  if(drag){S.zone={x:Math.min(drag.x,x),y:Math.min(drag.y,y),w:Math.abs(x-drag.x),h:Math.abs(y-drag.y)};drawMap();return}
  const hit=plot.find(o=>Math.hypot(o.px-x,o.py-y)<=o.r+3);
  document.getElementById('readout').textContent=hit?`${hit.p.name} · ${AXES[S.x].f(hit.p[S.x])} / ${AXES[S.y].f(hit.p[S.y])}`
    :`${AXES[S.x].l.split(' (')[0]} · ${AXES[S.y].l.split(' (')[0]}`;
  if(hit){const p=hit.p;
    tip.innerHTML=`<b>${p.name}</b><i>${POSN[p.pos]} · ${p.team} · ${p.owner?p.owner:'חופשי'}</i>
      <i>${AXES[S.x].l.split(' (')[0]}: ${AXES[S.x].f(p[S.x])} · ${AXES[S.y].l.split(' (')[0]}: ${AXES[S.y].f(p[S.y])}</i>
      <i>קושי 4 קרובים: ${fdrAvg(p,4).toFixed(1)}</i>`;
    tip.style.left=Math.min(hit.px+14,cv.clientWidth-160)+'px'; tip.style.top=(hit.py-10)+'px';
    tip.classList.add('on'); if(S.hover!==p.id){S.hover=p.id;drawMap()}}
  else{tip.classList.remove('on'); if(S.hover){S.hover=null;drawMap()}}});
cv.addEventListener('mouseleave',()=>{tip.classList.remove('on');S.hover=null;drawMap()});
let drag=null;
cv.addEventListener('mousedown',e=>{if(!S.zoneMode)return;drag=at(e)});
addEventListener('mouseup',()=>{if(drag){drag=null;
  if(S.zone&&(S.zone.w<14||S.zone.h<14))S.zone=null;
  S.zoneMode=false;document.getElementById('zoneBtn').setAttribute('aria-pressed','false');
  cv.style.cursor='crosshair';draw()}});
cv.addEventListener('click',e=>{if(S.zoneMode)return;const {x,y}=at(e);
  const hit=plot.find(o=>Math.hypot(o.px-x,o.py-y)<=o.r+3);
  S.sel=hit?hit.p.id:null;draw()});
function toggleZoneMode(){S.zoneMode=!S.zoneMode;
  document.getElementById('zoneBtn').setAttribute('aria-pressed',S.zoneMode);
  cv.style.cursor=S.zoneMode?'cell':'crosshair'; if(S.zoneMode)S.zone=null; draw()}
function inZone(){if(!S.zone)return [];
  return plot.filter(o=>o.px>=S.zone.x&&o.px<=S.zone.x+S.zone.w&&o.py>=S.zone.y&&o.py<=S.zone.y+S.zone.h).map(o=>o.p)}

/* =================== panels =================== */
const miniFx=p=>`<span class="mini-fx">${p.fdr.map(f=>`<i class="f${f.fdr}"></i>`).join('')}</span>`;
function drawList(){
  let d=visible(); const z=inZone();
  if(z.length)d=d.filter(p=>z.includes(p));
  d.sort((a,b)=>S.sort==='xdiff'?a.xdiff-b.xdiff:b[S.sort]-a[S.sort]);
  document.getElementById('plist').innerHTML=d.map((p,i)=>`
    <div class="pr ${S.sel===p.id?'sel':''}" onclick="pick(${p.id})">
      <span class="rk">${i+1}</span>
      <button class="st ${S.watch.has(p.id)?'on':''}" aria-label="מעקב"
        onclick="event.stopPropagation();togWatch(${p.id})">${S.watch.has(p.id)?'★':'☆'}</button>
      <div><h4>${p.name}</h4><div class="m"><span class="pos p-${p.pos}">${p.pos}</span>${p.team}
        ${p.owner===MY?'· שלי':p.owner?'· '+p.owner:'· <span class="free">חופשי</span>'} ${miniFx(p)}</div></div>
      <span class="xd ${p.xdiff<0?'neg':p.xdiff>0?'pos':''}">${p.xdiff>0?'+':''}${p.xdiff.toFixed(1)}</span>
      <span class="sc">${p.score}</span>
    </div>`).join('')||'<div style="padding:26px;text-align:center;color:var(--ink-3);font-size:13px">אין שחקנים בסינון.</div>';
}
function drawZone(){
  const el=document.getElementById('zone'),z=inZone();
  el.classList.toggle('on',!!S.zone);
  if(!S.zone)return;
  const free=z.filter(p=>!p.owner);
  const head=`<div class="zone-hd"><h3>⌗ אזור מטרה</h3>
      <span class="lab">${AXES[S.x].l.split(' (')[0]} · ${AXES[S.y].l.split(' (')[0]}</span>
      <span class="sp"></span><button class="btn" onclick="S.zone=null;draw()">נקה אזור</button></div>`;
  el.innerHTML=z.length?head+`
    <p><b>${z.length} שחקנים</b> באזור, מהם <b>${free.length} חופשיים</b>. במקום לעקוב אחרי שם אחד, שמור את האזור:
      הדף יתריע לך כשמישהו חדש נכנס לתחום הזה — עלה בדקות, שיפר xGI, או שוחרר ע״י קבוצה.</p>
    <div class="zone-acts">
      <button class="btn pri" onclick="alert('מוקאפ — האזור נשמר ויתריע על כל כניסה חדשה')">עקוב אחרי האזור הזה</button>
      ${free.length?`<button class="btn gold" onclick="watchZone()">★ הוסף את ${free.length} החופשיים למעקב</button>`:''}
      <button class="btn" onclick="alert('מוקאפ')">שמור כתצוגה</button>
    </div>`
    :head+`<p>האזור ריק. גרור אותו מחדש מעל אשכול עיגולים — האזור הוא התזה שלך
      (״קשר עם xGI מעל 0.5 שמשחק מעל 85% מהדקות״), והדף שומר עליה במקומך.</p>`;
}
function radar(p){
  const keys=[['xg90','xG'],['xa90','xA'],['dc90','הגנה'],['bonus90','בונוס'],['minPct','דקות'],['ease','לו״ז']];
  const val=k=>k==='ease'?ease(p):+p[k];
  const norm=k=>{const a=PLAYERS.map(x=>k==='ease'?ease(x):+x[k]);const mn=Math.min(...a),mx=Math.max(...a);
    return mx===mn?.5:(val(k)-mn)/(mx-mn)};
  const S2=208,c=S2/2,R=72;
  const pts=keys.map(([k],i)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length,r=R*Math.max(norm(k),.04);
    return [c+Math.cos(a)*r,c+Math.sin(a)*r]});
  const ring=f=>keys.map(([_],i)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;
    return `${c+Math.cos(a)*R*f},${c+Math.sin(a)*R*f}`}).join(' ');
  return `<svg width="${S2}" height="${S2}" viewBox="0 0 ${S2} ${S2}" aria-label="פרופיל השחקן">
    ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#E0E7E6"/>`).join('')}
    ${keys.map(([k,l],i)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;
      return `<line x1="${c}" y1="${c}" x2="${c+Math.cos(a)*R}" y2="${c+Math.sin(a)*R}" stroke="#E0E7E6"/>
      <text x="${c+Math.cos(a)*(R+15)}" y="${c+Math.sin(a)*(R+15)+3}" text-anchor="middle"
        font-size="9.5" fill="#84918F" font-family="ui-monospace,Menlo,monospace">${l}</text>`}).join('')}
    <polygon points="${pts.map(p2=>p2.join(',')).join(' ')}" fill="${POSC[p.pos]}26" stroke="${POSC[p.pos]}" stroke-width="1.6"/>
    ${pts.map(p2=>`<circle cx="${p2[0]}" cy="${p2[1]}" r="2.4" fill="${POSC[p.pos]}"/>`).join('')}
  </svg>`;
}
function drawDrawer(){
  const el=document.getElementById('drawer');
  if(!S.sel){el.classList.remove('on');el.innerHTML='';return}
  const p=PLAYERS.find(x=>x.id===S.sel),on=S.watch.has(p.id);
  el.classList.add('on');
  el.innerHTML=`
    <div class="dr-hd">
      <span class="pos p-${p.pos}" style="font-size:10px;padding:3px 6px">${p.pos}</span>
      <h2>${p.name}</h2>
      <span class="lab">${POSN[p.pos]} · ${p.team} · ${p.owner===MY?'הקבוצה שלי':p.owner?'אצל '+p.owner:'חופשי'}</span>
      <span class="sp"></span>
      <button class="btn gold" onclick="togWatch(${p.id})">${on?'★ במעקב':'☆ הוסף למעקב'}</button>
      <button class="btn pri" onclick="alert('מוקאפ')">${p.owner?'הצע טרייד':'הגש וויוור'}</button>
      <button class="btn" onclick="S.sel=null;draw()">סגור</button>
    </div>
    <div class="dr-grid">
      <section><h4 class="lab">הקריאה</h4><p>${num(p.note)}</p><div class="rz">${p.reasons.map(t=>`<span>${num(t)}</span>`).join('')}</div>
        <div class="kv">
          <div><span>ציון סקאוטינג</span><b>${p.score}</b></div>
          <div><span>חיזוי מחזור הבא / 4 מחזורים</span><b>${p.pred1.toFixed(1)} / ${p.pred4.toFixed(1)}</b></div>
          <div><span>xDiff</span><b style="color:${p.xdiff<0?'var(--good)':p.xdiff>0?'var(--bad)':'inherit'}">${p.xdiff>0?'+':''}${p.xdiff.toFixed(1)}</b></div>
          <div><span>מצבים נייחים</span><b>${[p.pen&&'פנדל',p.cor&&'קרן',p.fk&&'חופשית'].filter(Boolean).join(' · ')||'—'}</b></div>
          <div><span>ביקוש בליגה</span><b>${p.heat}%</b></div>
        </div></section>
      <section><h4 class="lab">פרופיל מול הליגה</h4>${radar(p)}</section>
      <section><h4 class="lab">ששת המשחקים הבאים</h4>
        <div class="fxwide">${p.fdr.map(f=>`<i class="f${f.fdr}${f.home?'':' away'}">${f.opp}</i>`).join('')}</div>
        <div class="kv">
          <div><span>קושי 3 / 6 קרובים</span><b>${fdrAvg(p,3).toFixed(1)} / ${fdrAvg(p,6).toFixed(1)}</b></div>
          <div><span>% דקות · סה״כ</span><b>${p.minPct}% · ${p.mins}</b></div>
          <div><span>G+A</span><b>${p.ga}</b></div>
        </div>
        <div style="margin-top:10px"><span class="lab">נקודות ב-6 המחזורים</span>
          <div style="display:flex;gap:3px;align-items:flex-end;height:42px;margin-top:6px">
            ${p.spark.map(v=>`<span style="flex:1;background:${POSC[p.pos]}44;border-top:2px solid ${POSC[p.pos]};
              height:${Math.max(v/Math.max(...p.spark)*100,6)}%" title="${v} נק׳"></span>`).join('')}
          </div></div>
      </section>
    </div>`;
}
function drawRail(){
  const w=[...S.watch].map(id=>PLAYERS.find(p=>p.id===id)).filter(Boolean);
  document.getElementById('wlCount').textContent=w.length;
  document.getElementById('wlItems').innerHTML=w.length?w.map(p=>`
    <span class="wc" onclick="pick(${p.id})"><span class="pos p-${p.pos}">${p.pos}</span>${p.name}
      <b>${p.score}</b>${miniFx(p)}
      <button class="x" aria-label="הסר" onclick="event.stopPropagation();togWatch(${p.id})">×</button></span>`).join('')
    :'<span class="empty">לחץ על ☆ במפה או ברשימה — או סמן אזור מטרה ועקוב אחרי כל מי שנכנס אליו.</span>';
}
function drawTicker(){
  const mv=PLAYERS.map(p=>({p,d:Math.round((p.form-p.ppg)*3)})).filter(o=>o.d)
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,9);
  document.getElementById('ticker').innerHTML=mv.map(({p,d})=>`
    <span class="mv ${d>0?'up':'dn'}" onclick="pick(${p.id})">
      <i class="d" style="background:${POSC[p.pos]}"></i>${p.name}
      <b>${d>0?'▲+':'▼'}${d}</b></span>`).join('');
}
/* =================== actions =================== */
function draw(){drawMap();drawList();drawZone();drawDrawer();drawRail()}
function pick(id){S.sel=id;draw();document.getElementById('drawer').scrollIntoView({block:'nearest',behavior:'smooth'})}
function togWatch(id){S.watch.has(id)?S.watch.delete(id):S.watch.add(id);draw()}
function watchZone(){inZone().filter(p=>!p.owner).forEach(p=>S.watch.add(p.id));draw()}
function setAvail(v,btn){S.avail=v;
  [...document.querySelectorAll('#availTog button')].forEach(b=>b.setAttribute('aria-pressed',b===btn));draw()}
addEventListener('resize',()=>drawMap());
addEventListener('keydown',e=>{if(e.key==='Escape'){S.sel=null;S.zone=null;draw()}});
drawTicker();draw();
</script>
